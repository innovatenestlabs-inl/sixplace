version: 1.0.0

homepage: https://github.com/innovatenestlabs-inl/sixplace
repository: https://github.com/innovatenestlabs-inl/sixplace
issue_tracker: https://github.com/innovatenestlabs-inl/sixplace/issues

topics:
  - flutter
  - responsive
  - networking
  - forms
  - sqlite

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  android_id: ^0.5.2
  battery_plus: ^7.1.2
  device_info_plus: ^12.4.0
  shared_preferences: '>=2.5.4 <2.5.6'
  uuid: ^4.5.1
  http: ^1.6.0
  http_parser: ^4.1.2
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  sqflite_common_ffi: ^2.3.7

